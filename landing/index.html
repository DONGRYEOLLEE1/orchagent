<script>
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "accent": "amber",
    "scenario": "vision",
    "bg": "grid"
  }/*EDITMODE-END*/;
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Scenarios.jsx"></script>
<script type="text/babel" src="HeroGraph.jsx"></script>
<script type="text/babel" src="Landing.jsx"></script>
<script type="text/babel" src="LandingSections.jsx"></script>

<script type="text/babel">
  const { useState, useEffect } = React;

  function App() {
    const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
    const [tweaksOpen, setTweaksOpen] = useState(false);

    // Apply accent tweaks to CSS variables
    useEffect(() => {
      const accent = window.ACCENTS[tweaks.accent] || window.ACCENTS.cyan;
      const root = document.documentElement;
      root.style.setProperty("--accent", accent.primary);
      root.style.setProperty("--signal", accent.signal);
      root.style.setProperty("--accent-dim", accent.primary.replace(/0\.\d+/, (m) => (parseFloat(m) * 0.7).toFixed(2)));
      root.style.setProperty("--accent-bg", accent.primary.replace(")", " / 0.12)"));
    }, [tweaks.accent]);

    // Apply background density
    useEffect(() => {
      document.body.dataset.bg = tweaks.bg;
      const style = document.getElementById("bg-style") || (() => {
        const s = document.createElement("style"); s.id = "bg-style"; document.head.appendChild(s); return s;
      })();
      if (tweaks.bg === "clean") style.textContent = "body::before { display: none; }";
      else if (tweaks.bg === "grid") style.textContent = "body::before { opacity: 2; background-size: 40px 40px; mask-image: none; }";
      else style.textContent = "";
    }, [tweaks.bg]);

    // Edit-mode wiring
    useEffect(() => {
      const onMsg = (e) => {
        if (e.data?.type === "__activate_edit_mode") setTweaksOpen(true);
        if (e.data?.type === "__deactivate_edit_mode") setTweaksOpen(false);
      };
      window.addEventListener("message", onMsg);
      window.parent.postMessage({ type: "__edit_mode_available" }, "*");
      return () => window.removeEventListener("message", onMsg);
    }, []);

    const updateTweaks = (next) => {
      setTweaks(next);
      window.parent.postMessage({ type: "__edit_mode_set_keys", edits: next }, "*");
    };

    return (
      <>
        <Hero scenarioId={tweaks.scenario} setScenarioId={(s) => updateTweaks({...tweaks, scenario: s})} />
        <DemoConsole scenarioId={tweaks.scenario} setScenarioId={(s) => updateTweaks({...tweaks, scenario: s})} />
        <Features />
        <Architecture />
        <CodeSection />
        <CTA />
        <Footer />
        <TweaksPanel
          tweaks={tweaks}
          setTweaks={updateTweaks}
          active={tweaksOpen}
          setActive={setTweaksOpen}
        />
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
</script>

</body>
</html>
