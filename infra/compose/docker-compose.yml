services:
  db:
    image: postgres:15-alpine
    container_name: orchagent-db
    ports:
      # - "5432:5432"  # before: 모든 인터페이스(0.0.0.0)에 바인딩 → LAN 노출
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orchagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: orchagent-adminer
    ports:
      # - "9090:8080"  # before: 모든 인터페이스(0.0.0.0)에 바인딩 → LAN 노출
      - "127.0.0.1:9090:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ../../
      dockerfile: infra/docker/backend.Dockerfile
    container_name: orchagent-backend
    env_file:
      - ../../apps/backend/.env
    ports:
      # - "8002:8002"  # before: 모든 인터페이스(0.0.0.0)에 바인딩 → LAN 노출
      - "127.0.0.1:8002:8002"
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orchagent
      BACKEND_PORT: "8002"
      PYTHONUNBUFFERED: "1"
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ../../apps/backend:/app/apps/backend
      - ../../packages/agent-core:/app/packages/agent-core
      - ../../packages/agent-tools:/app/packages/agent-tools
      - ../../packages/prompt-kit:/app/packages/prompt-kit
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8002", "--reload", "--reload-dir", "/app/apps/backend", "--reload-dir", "/app/packages/agent-core/src", "--reload-dir", "/app/packages/agent-tools/src", "--reload-dir", "/app/packages/prompt-kit/src", "--log-level", "debug"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../../
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8002
    container_name: orchagent-frontend
    ports:
      # - "3000:3000"  # before: 모든 인터페이스(0.0.0.0)에 바인딩 → LAN 노출
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8002
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ../../apps/frontend:/app/apps/frontend
      - frontend_node_modules:/app/apps/frontend/node_modules
      - frontend_next_cache:/app/apps/frontend/.next
    command:
      [
        "sh",
        "-lc",
        "npm install --include=dev && npm run dev -- --hostname 0.0.0.0 --port 3000",
      ]
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
  frontend_next_cache:
